<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — ByteGif</title>
  <meta name="description" content="Sorry, we couldn't find that page. Head back to ByteGif to explore our apps.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fafafa">
  <script>
    (function () {
      const saved = localStorage.getItem('bytegif-theme');
      if (saved === 'dark' || saved === 'light') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
  <link rel="icon" href="/images/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>

<body class="not-found-page">
  <header>
    <div class="wrap">
      <nav>
        <a class="brand" href="/">
          <img src="/images/main-logo.png" alt="ByteGif logo">
          ByteGif
        </a>
        <div class="nav-actions">
          <a class="nav-cta" href="/">Back to home <span aria-hidden="true">→</span></a>
          <button class="theme-toggle" type="button" aria-label="Toggle dark or light mode" title="Toggle theme">
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="not-found">
      <div class="not-found__content">
        <div class="not-found__code" aria-hidden="true">404</div>
        <div class="eyebrow"><span class="dot"></span> PAGE NOT FOUND</div>
        <h1>This page <span class="accent">is missing.</span></h1>
        <p>The link may be broken, or the page may have moved. Head back to the homepage or browse the app directory.</p>
        <div class="hero-actions">
          <a class="btn-primary" href="/">Go to homepage <span aria-hidden="true">→</span></a>
          <a class="btn-ghost" href="/apps.html">Browse apps</a>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const themeBtn = document.querySelector('.theme-toggle');
      if (themeBtn) {
        themeBtn.addEventListener('click', () => {
          const root = document.documentElement;
          const current = root.getAttribute('data-theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const isDark = current ? current === 'dark' : systemDark;
          const next = isDark ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          localStorage.setItem('bytegif-theme', next);
        });
      }
    });
  </script>
</body>

</html>
